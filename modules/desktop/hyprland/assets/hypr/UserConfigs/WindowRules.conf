# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Yazi file manager - floating window
windowrule {
  name = float-yazi-fm
  match:class = yazi-fm
  float = on
  size = 900 600
  center = on
}
windowrule = workspace special:yazi silent, match:class yazi-fm

# Todo scratchpad - floating neovim
windowrule {
  name = float-todo-nvim
  match:class = todo-nvim
  float = on
  size = 900 600
  center = on
}
windowrule = workspace special:todo silent, match:class todo-nvim

# Quick note scratchpad - floating neovim
windowrule {
  name = float-quick-note-nvim
  match:class = quick-note-nvim
  float = on
  size = 900 600
  center = on
}
windowrule = workspace special:quick-note silent, match:class quick-note-nvim
